{% load i18n static %}
<section class="relative isolate overflow-hidden bg-navy-900 text-white" aria-label="{% trans 'En-tête principal' %}">

  <!-- === ARRIÈRE-PLAN : grande photo garage === -->
  <div class="absolute inset-0" aria-hidden="true">
    <img
      src="{% static 'img/garage-bays.jpg' %}"
      alt=""
      class="w-full h-full object-cover object-center"
      style="filter: brightness(1.15) contrast(1.05) saturate(1.08);"
      fetchpriority="high"
      >
    <div class="absolute inset-0" style="background: linear-gradient(105deg, rgba(0,0,43,0.88) 0%, rgba(0,0,43,0.62) 42%, rgba(0,0,43,0.28) 72%, rgba(0,0,43,0.08) 100%);"></div>
    
  </div>

  <!-- === CONTENU PRINCIPAL === -->
  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex min-h-[640px] sm:min-h-[720px] lg:min-h-[86vh] items-center py-20 sm:py-24 lg:py-32">
    <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-10 items-center">

      <!-- ===== COLONNE GAUCHE : TEXTE + CTA ===== -->
      <div class="lg:col-span-7 text-center lg:text-left hero-fade" style="text-shadow: 0 2px 16px rgba(0,0,43,0.65);">
        <!-- Badge d'introduction -->
        <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-white/10 border border-white/15 backdrop-blur-sm mb-7 sm:mb-9">
          <span class="w-2 h-2 rounded-full bg-accent-400 shadow-[0_0_12px_2px_rgba(255,122,51,0.6)]"></span>
          <span class="text-xs sm:text-sm font-semibold text-white/85 tracking-wide">{% trans "Le réseau n°1 de garages vérifiés au Cameroun" %}</span>
        </div>

        <!-- Titre principal -->
        <h1 class="font-display font-bold text-white leading-[1.02] tracking-[-0.03em] text-4xl sm:text-5xl md:text-6xl lg:text-[4.5rem] xl:text-7xl mb-6 sm:mb-7">
          {% trans "Trouvez un garage de confiance" %}
          <span class="block text-accent-400">{% trans "près de chez vous" %}</span>
        </h1>

        <!-- Sous-titre -->
        <p class="text-lg sm:text-xl lg:text-2xl text-white/75 mb-9 max-w-2xl mx-auto lg:mx-0 leading-relaxed">
          {% trans "AutoLink vous connecte instantanément avec des garages certifiés au Cameroun. " %}
        </p>

        <div class="flex flex-col sm:flex-row items-center gap-4 justify-center lg:justify-start">
          <a
            href="{% url 'search:nearby_page' %}"
            class="btn btn-xl btn-accent w-full sm:w-auto"
            style="text-shadow: none;"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            {% trans "Trouver un garage maintenant" %}
          </a>
        </div>
      </div>

      
    </div>
  </div>

  <!-- Dégradé en bas pour fondu -->
</section>
