{% load i18n %}
{% if cities %}
<section class="bg-auto-deep-red relative overflow-hidden" aria-labelledby="cities-heading">
    {# Background effects #}
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(205,129,53,0.1),transparent_70%)]" aria-hidden="true"></div>

    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 py-12 sm:py-16">
        <div class="text-center mb-8 sm:mb-10">
            <span class="inline-block text-auto-gold text-xs font-bold tracking-widest uppercase mb-2">{% trans "Présence" %}</span>
            <h2 id="cities-heading" class="text-xl sm:text-2xl md:text-3xl font-bold text-white">{% trans "Villes couvertes" %}</h2>
            <p class="text-white/50 text-sm mt-2 max-w-md mx-auto">{% trans "Retrouvez nos partenaires dans les principales villes du Cameroun." %}</p>
        </div>

        <div class="flex flex-wrap justify-center gap-2 sm:gap-3" role="list" aria-label="{% trans 'Villes disponibles' %}">
            {% for city in cities %}
            <a href="{% url 'garages:garage_list' %}?city={{ city }}" role="listitem"
               class="group inline-flex items-center gap-2 bg-white/[0.07] hover:bg-auto-orange border border-white/[0.08] hover:border-auto-orange px-5 sm:px-6 py-2.5 sm:py-3 rounded-full transition-all duration-300 hover:shadow-[0_4px_20px_rgba(205,129,53,0.3)]">
                <svg class="w-4 h-4 text-auto-gold group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span class="text-white/80 group-hover:text-white text-sm sm:text-base font-bold transition-colors">{{ city }}</span>
            </a>
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
