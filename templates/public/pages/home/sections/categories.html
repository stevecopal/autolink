{% load i18n %}
{% if categories %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 py-12 sm:py-16" aria-labelledby="categories-heading">
    <div class="text-center mb-8 sm:mb-10">
        <span class="inline-block text-auto-orange text-xs font-bold tracking-widest uppercase mb-2">{% trans "Explorer" %}</span>
        <h2 id="categories-heading" class="text-xl sm:text-2xl md:text-3xl font-bold text-auto-dark">{% trans "Par catégorie" %}</h2>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4">
        {% for cat in categories %}
        <a href="{% url 'catalog:category_detail' slug=cat.slug %}" class="group bg-white rounded-2xl p-4 sm:p-5 text-center border border-gray-100 shadow-[0_1px_3px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] hover:border-auto-orange/20 transition-all duration-300 hover:-translate-y-0.5">
            <div class="w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-br from-auto-orange/10 to-auto-orange/5 rounded-2xl flex items-center justify-center mx-auto mb-3 group-hover:from-auto-orange/20 group-hover:to-auto-orange/10 transition-all duration-300 text-2xl sm:text-3xl" aria-hidden="true">
                {{ cat.icon|default:"&#128230;" }}
            </div>
            <h3 class="font-bold text-auto-dark group-hover:text-auto-orange transition text-xs sm:text-sm mb-1">{{ cat.name }}</h3>
            <p class="text-gray-400 text-[10px] sm:text-xs">{{ cat.part_count }} {% trans "pièces" %}</p>
        </a>
        {% endfor %}
    </div>
</section>
{% endif %}
