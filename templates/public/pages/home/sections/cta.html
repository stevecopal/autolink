{% load i18n %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 pb-12 sm:pb-16" aria-labelledby="cta-heading">
    <div class="relative overflow-hidden rounded-3xl bg-auto-deep-red">
      
        <div class="relative z-10 px-6 sm:px-10 md:px-14 py-10 sm:py-14 md:py-16 text-center">
            

            <h2 id="cta-heading" class="text-2xl sm:text-3xl md:text-4xl font-bold text-white mb-3 sm:mb-4 leading-tight">
                {% trans "Vous êtes un professionnel automobile ?" %}
            </h2>
            <p class="text-white/60 mb-8 sm:mb-10 max-w-xl mx-auto text-sm sm:text-base leading-relaxed">
                {% trans "Rejoignez AutoLink et trouvez de nouveaux clients. Inscrivez votre garage gratuitement et développez votre activité." %}
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4">
                <a href="{% url 'garages:garage_create' %}" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-white text-auto-deep-red font-bold px-8 py-3.5 rounded-xl hover:bg-gray-50 transition-all duration-200 shadow-[0_4px_20px_rgba(0,0,0,0.15)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.2)] hover:-translate-y-0.5 text-sm sm:text-base">
                    {% trans "Inscrire mon garage" %}
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                </a>
                <a href="{% url 'core:contact' %}" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-white/[0.08] hover:bg-white/[0.12] text-white border border-white/[0.1] font-bold px-8 py-3.5 rounded-xl transition-all duration-200 text-sm sm:text-base">
                    {% trans "Nous contacter" %}
                </a>
            </div>
        </div>
    </div>
</section>
