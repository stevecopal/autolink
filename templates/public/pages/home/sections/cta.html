{% load i18n static %}
<section class="bg-accent-50" aria-labelledby="cta-heading">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-20 lg:py-24">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-9 lg:gap-12 items-center">

            <div class="lg:col-span-7">
                <h2 id="cta-heading" class="font-display text-4xl sm:text-5xl lg:text-6xl font-bold text-navy-900 mb-5 leading-[1.03] tracking-[-0.02em]">
                    {% trans "Inscrivez votre garage" %}
                    <span class="block text-accent-600">{% trans "gratuitement." %}</span>
                </h2>
                <p class="text-graphite-600 mb-0 max-w-2xl text-base sm:text-lg leading-relaxed">
                    {% trans "Plusieurs garages ont rejoint AutoLink ce mois-ci. Recevez des demandes qualifiées, gérez votre stock et développez votre activité." %}
                </p>
            </div>

            <div class="lg:col-span-5 flex flex-col items-center lg:items-end gap-4">
                <a href="{% url 'garages:garage_create' %}"
                   class="btn btn-xl btn-dark w-full sm:w-auto sm:min-w-[18rem] justify-center">
                    {% trans "Inscrire mon garage" %}
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                </a>
            </div>

        </div>
    </div>
</section>
