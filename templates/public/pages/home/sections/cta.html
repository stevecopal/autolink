{% load i18n %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-14 sm:pb-18" aria-labelledby="cta-heading">
    <div class="relative overflow-hidden rounded-2xl bg-navy-900">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,rgba(28,109,208,0.15),transparent_60%)]" aria-hidden="true"></div>

        <div class="relative z-10 px-6 sm:px-10 md:px-14 py-12 sm:py-14 md:py-16 text-center">
            <h2 id="cta-heading" class="font-display text-2xl sm:text-3xl md:text-4xl font-bold text-white mb-3 sm:mb-4 leading-tight tracking-tight">
                {% trans "Vous êtes un professionnel automobile ?" %}
            </h2>
            <p class="text-white/45 mb-8 sm:mb-10 max-w-xl mx-auto text-sm sm:text-base leading-relaxed">
                {% trans "Rejoignez AutoLink et trouvez de nouveaux clients. Inscrivez votre garage gratuitement et développez votre activité." %}
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4">
                <a href="{% url 'garages:garage_create' %}" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-blue-500 text-white font-bold px-8 py-3.5 rounded-xl hover:bg-blue-500/90 transition-colors duration-200 text-sm sm:text-base">
                    {% trans "Inscrire mon garage" %}
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                </a>
                <a href="{% url 'core:contact' %}" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-white/[0.06] hover:bg-white/[0.1] text-white border border-white/[0.1] font-bold px-8 py-3.5 rounded-xl transition-colors duration-200 text-sm sm:text-base">
                    {% trans "Nous contacter" %}
                </a>
            </div>
        </div>
    </div>
</section>
