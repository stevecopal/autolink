{% load static i18n %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000080">
    <meta name="robots" content="noindex, nofollow">
    <title>{% trans "Connexion interrompue" %} - AutoLink</title>
    <meta name="description" content="{% trans "Vous êtes actuellement hors ligne. Vérifiez votre connexion Internet puis rechargez la page." %}">

    <link rel="icon" href="{% static 'logo.jpg' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="min-h-screen bg-steel-50 font-body text-graphite-900 antialiased">

    <main class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 py-16 sm:py-24">
        <div class="w-full max-w-md">

            <!-- Carte -->
            <div class="bg-white rounded-2xl border border-line-200 shadow-card px-6 py-10 sm:px-10 sm:py-12 text-center">

                <!-- Icône -->
                <div class="mx-auto flex h-20 w-20 sm:h-24 sm:w-24 items-center justify-center rounded-full bg-navy-50 border border-navy-100 text-navy-500 animate-pulse-soft">
                    <svg id="offline-icon" class="h-9 w-9 sm:h-11 sm:w-11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 20h.01"/>
                        <path d="M2 8.82a15 15 0 0 1 20 0"/>
                        <path d="M5 12.86a10 10 0 0 1 14 0"/>
                        <path d="M8.5 16.43a5 5 0 0 1 7 0"/>
                        <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>
                    </svg>
                </div>

                <!-- Message -->
                <h1 class="mt-8 font-display text-2xl sm:text-3xl font-bold text-navy-900">
                    {% trans "Connexion interrompue" %}
                </h1>

                <p class="mt-4 text-sm sm:text-base text-graphite-600 leading-relaxed">
                    {% trans "Veuillez activer vos données mobiles ou votre Wi-Fi, vérifier que vous êtes bien connecté au réseau, puis rechargez la page." %}
                </p>

                <!-- Action -->
                <button id="retry-btn"
                        type="button"
                        class="btn btn-primary w-full mt-8"
                        aria-label="{% trans 'Réessayer la connexion' %}">
                    <svg id="retry-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    <span id="retry-label">{% trans "Réessayer" %}</span>
                    <span id="retry-spinner" class="hidden w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin" aria-hidden="true"></span>
                </button>

                <!-- État du réseau -->
                <div class="mt-6 inline-flex items-center gap-2.5 rounded-lg bg-steel-50 border border-line-200 px-3 py-1.5 font-mono text-xs uppercase tracking-wider text-graphite-600"
                     role="status"
                     aria-live="polite">
                    <span id="net-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse-soft" aria-hidden="true"></span>
                    <span id="net-label">{% trans "Hors ligne" %}</span>
                </div>

               
            </div>

           
        </div>
    </main>

    <script>
    (function () {
        'use strict';

        var btn = document.getElementById('retry-btn');
        var label = document.getElementById('retry-label');
        var spinner = document.getElementById('retry-spinner');
        var icon = document.getElementById('retry-icon');
        var dot = document.getElementById('net-dot');
        var netLabel = document.getElementById('net-label');
        var offlineIcon = document.getElementById('offline-icon');

        if (!btn) { return; }

        var isLoading = false;

        // ── Nouvelle tentative de connexion ──
        btn.addEventListener('click', function () {
            if (isLoading) { return; }
            isLoading = true;

            btn.disabled = true;
            btn.setAttribute('aria-busy', 'true');
            btn.classList.add('opacity-70', 'pointer-events-none');
            if (icon) { icon.classList.add('hidden'); }
            if (spinner) { spinner.classList.remove('hidden'); }
            if (label) { label.textContent = "{% trans 'Connexion en cours...' %}"; }

            window.setTimeout(function () {
                window.location.reload();
            }, 700);
        });

        // ── Indicateur réseau ──
        function updateStatus() {
            var online = navigator.onLine;

            if (netLabel) {
                netLabel.textContent = online ? "{% trans 'En ligne' %}" : "{% trans 'Hors ligne' %}";
            }
            if (dot) {
                dot.classList.toggle('bg-emerald-500', online);
                dot.classList.toggle('bg-red-500', !online);
                dot.classList.toggle('animate-pulse-soft', !online);
            }
            if (offlineIcon) {
                offlineIcon.classList.toggle('text-emerald-600', online);
                offlineIcon.classList.toggle('text-navy-500', !online);
            }
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    })();
    </script>
</body>
</html>
